name: Build Switch Play Timer

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add devkitPro apt repository
        run: |
          # Add devkitPro apt repo (official method)
          wget -q https://devkitpro.org/files/devkitpro-pubkey.gpg -O /tmp/devkitpro.gpg
          sudo cp /tmp/devkitpro.gpg /etc/apt/trusted.gpg.d/devkitpro.gpg
          echo "deb https://devkitpro.org/debian generic main" | sudo tee /etc/apt/sources.list.d/devkitpro.list
          sudo apt-get update
        shell: bash

      - name: Install devkitA64 + libnx via apt
        run: |
          sudo apt-get install -y devkita64 libnx
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITA64=/opt/devkitpro/devkitA64" >> $GITHUB_ENV
          echo "/opt/devkitpro/devkitA64/bin" >> $GITHUB_PATH
          echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH
        shell: bash

      - name: Build
        run: |
          make -j$(nproc) 2>&1
        shell: bash

      - name: List build outputs
        run: |
          ls -la build/ || echo "build/ not found"
          find . -name "*.nro" -o -name "*.ovl" -o -name "*.elf" 2>/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-play-timer
          path: |
            build/*.nro
            build/*.ovl
            build/*.elf
          if-no-files-found: error