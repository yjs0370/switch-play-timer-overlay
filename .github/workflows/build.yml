name: Build Switch Play Timer

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install devkitPro
        run: |
          # Install devkitPro pacman
          wget -q https://github.com/devkitPro/pacman/releases/download/v1.0.2/devkitpro-pacman.deb -O /tmp/devkitpro-pacman.deb
          sudo dpkg -i /tmp/devkitpro-pacman.deb || true
          sudo apt-get install -f -y
          # Install switch dev tools
          sudo dkp-pacman -S devkita64 libnx --noconfirm || true
          # Fallback: use devkitPro Docker to get the tools
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "/opt/devkitpro/devkitA64/bin" >> $GITHUB_PATH
          echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH
        shell: bash

      - name: Build via devkitPro Docker (reliable)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e DEVKITPRO=/opt/devkitpro \
            devkitpro/devkita64 \
            bash -c "make -j\$(nproc) 2>&1 || (echo '--- Trying make clean ---' && make clean && make -j\$(nproc) 2>&1)"
        shell: bash

      - name: List build outputs
        run: |
          ls -la build/ || echo "build/ not found"
          find . -name "*.nro" -o -name "*.ovl" -o -name "*.elf" 2>/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-play-timer
          path: |
            build/*.nro
            build/*.ovl
            build/*.elf
          if-no-files-found: error