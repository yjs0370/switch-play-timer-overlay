name: Build Tesla Overlay

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libtesla (download single header)
        run: |
          mkdir -p /opt/devkitpro/portlibs/switch/include/tesla
          curl -L -o /opt/devkitpro/portlibs/switch/include/tesla.hpp \
            https://raw.githubusercontent.com/WerWolv/libtesla/master/tesla.hpp
          ls -la /opt/devkitpro/portlibs/switch/include/tesla.hpp
          head -5 /opt/devkitpro/portlibs/switch/include/tesla.hpp

      - name: Build overlay
        run: make -j$(nproc) 2>&1

      - name: List build outputs
        run: |
          ls -la build/ || echo "build/ not found"
          find . -name "*.ovl" -o -name "*.elf" 2>/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-play-timer-overlay
          path: |
            build/switch-play-timer-overlay.ovl
            build/*.ovl
            build/*.elf
          if-no-files-found: error
