name: Build Switch Play Timer

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with devkitPro Docker (fix sys/lock.h)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            devkitpro/devkita64 \
            bash -c "
              # Create dummy sys/lock.h if missing
              SYSLOCK=/opt/devkitpro/devkitA64/aarch64-none-elf/include/sys/lock.h
              if [ ! -f \"\$SYSLOCK\" ]; then
                mkdir -p \$(dirname \"\$SYSLOCK\")
                echo '/* dummy sys/lock.h */' > \"\$SYSLOCK\"
              fi
              # Also check libnx include path
              SYSLOCK2=/opt/devkitpro/libnx/include/sys/lock.h
              if [ ! -f \"\$SYSLOCK2\" ]; then
                mkdir -p \$(dirname \"\$SYSLOCK2\")
                echo '/* dummy sys/lock.h */' > \"\$SYSLOCK2\"
              fi
              make -j\$(nproc) 2>&1
            "
        shell: bash

      - name: List build outputs
        run: |
          ls -la build/ || echo "build/ not found"
          find . -name "*.nro" -o -name "*.ovl" -o -name "*.elf" 2>/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-play-timer
          path: |
            build/*.nro
            build/*.ovl
            build/*.elf
          if-no-files-found: error