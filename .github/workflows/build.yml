name: Build Switch Play Timer

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make -j$(nproc) 2>&1

      - name: List build outputs
        run: |
          ls -la build/ || echo "build/ not found"
          find . -name "*.nro" -o -name "*.elf" 2>/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: switch-play-timer
          path: |
            build/switch-play-timer.nro
            build/*.nro
            build/*.elf
          if-no-files-found: error
